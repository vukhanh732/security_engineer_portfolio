<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">SentryNode implemented request path</title><desc id="desc">SSH and nginx logs feed a collector, HTTP API, detection engine and in-memory alerts. IP reputation uses a separate endpoint and optional Redis cache.</desc><rect width="1400" height="760" fill="#e4ebe5"/><g fill="#254a50" font-family="monospace"><text x="70" y="85" font-size="17" letter-spacing="3">SENTRYNODE / IMPLEMENTED REQUEST PATH</text><text x="70" y="163" font-family="sans-serif" font-size="47" letter-spacing="-1">From log lines to an alert.</text></g><g fill="#f7f8f1" stroke="#a6b8ae" stroke-width="2"><rect x="70" y="255" width="245" height="145"/><rect x="385" y="255" width="245" height="145"/><rect x="700" y="255" width="245" height="145"/><rect x="1015" y="255" width="315" height="145"/></g><g stroke="#426b66" stroke-width="2" fill="none"><path d="M315 327h65m-10-7 10 7-10 7M630 327h65m-10-7 10 7-10 7M945 327h65m-10-7 10 7-10 7"/></g><g fill="#254a50" font-family="sans-serif" font-size="25"><text x="95" y="305">01 / Collect</text><text x="410" y="305">02 / Ingest</text><text x="725" y="305">03 / Detect</text><text x="1040" y="305">04 / Investigate</text></g><g fill="#4c625b" font-family="monospace" font-size="17"><text x="95" y="346">SSH + nginx logs</text><text x="95" y="377">Bounded retries</text><text x="410" y="346">FastAPI / HTTP</text><text x="410" y="377">500 events / batch</text><text x="725" y="346">Stateful rules</text><text x="725" y="377">Suspicious patterns</text><text x="1040" y="346">In-memory alert feed</text><text x="1040" y="377">GET /api/alerts</text></g><path d="M70 464h1260" stroke="#a6b8ae"/><g fill="#254a50" font-family="sans-serif"><text x="70" y="528" font-size="25">Separate reputation lookup</text><text x="70" y="571" font-family="monospace" font-size="19">IP endpoint → AbuseIPDB → optional Redis cache</text><text x="70" y="670" font-family="monospace" font-size="16">CURRENT BOUNDARY / no durable queue · alerts reset on restart</text></g></svg>
