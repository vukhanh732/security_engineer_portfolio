name: Site quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate HTML, metadata, and local links
        run: node scripts/validate-site.mjs
      - name: Start static site
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
      - name: Run Lighthouse
        run: |
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=/tmp/lighthouse.json --quiet
          node -e 'const r=require("/tmp/lighthouse.json"); const limits={performance:.95,accessibility:.95,"best-practices":.90,seo:.95}; for(const [key,min] of Object.entries(limits)){const score=r.categories[key].score; console.log(`${key}: ${Math.round(score*100)}`); if(score<min) process.exitCode=1}'
